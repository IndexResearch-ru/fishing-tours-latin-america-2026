<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Архитектура рыболовной поездки в Латинскую Америку</title>
<desc id="d">Цепочка от выбора рыбы и сезона через логистику к рыбалке и дальнейшему путешествию.</desc>
<rect width="1200" height="440" fill="#f6f9fb"/>
<text x="60" y="67" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0E3455">Что должен связать организатор</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="55" y="140" width="190" height="115" rx="16" fill="#e8f1f6"/><text x="150" y="185" font-size="21" font-weight="700" fill="#0E3455">Рыба и сезон</text><text x="150" y="219" font-size="17" fill="#294d65">река · регион</text>
<text x="267" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="290" y="140" width="190" height="115" rx="16" fill="#e8f1f6"/><text x="385" y="185" font-size="21" font-weight="700" fill="#0E3455">Дорога</text><text x="385" y="219" font-size="17" fill="#294d65">рейс · чартер · лодка</text>
<text x="502" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="525" y="140" width="190" height="115" rx="16" fill="#e8f1f6"/><text x="620" y="185" font-size="21" font-weight="700" fill="#0E3455">Рыбалка</text><text x="620" y="219" font-size="17" fill="#294d65">гид · снасти · лицензия</text>
<text x="737" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="760" y="140" width="190" height="115" rx="16" fill="#e8f1f6"/><text x="855" y="185" font-size="21" font-weight="700" fill="#0E3455">Координация</text><text x="855" y="219" font-size="17" fill="#294d65">язык · поддержка</text>
<text x="972" y="202" font-size="34" fill="#2F6B8F">→</text>
<rect x="995" y="140" width="150" height="115" rx="16" fill="#d8e8f2"/><text x="1070" y="185" font-size="20" font-weight="700" fill="#0E3455">Маршрут</text><text x="1070" y="219" font-size="16" fill="#294d65">города · страны</text>
</g>
<text x="60" y="342" font-family="Arial,sans-serif" font-size="22" fill="#294d65">Именно поэтому fishing-first оператор и универсальный DMC могут занимать разные места в зависимости от сценария.</text>
</svg>